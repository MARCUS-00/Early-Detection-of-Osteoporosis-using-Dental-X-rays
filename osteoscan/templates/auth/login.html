{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block main_class %}site-main--auth{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo">O+</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to your OsteoScan account</p>
  </div>

  <form method="POST">
    <div class="form-field">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" type="text" id="username" name="username"
             required autocomplete="username" autofocus>
    </div>
    <div class="form-field">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" name="password"
             required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 8px;">
      Sign In
    </button>
  </form>

  <p class="auth-footer">
    No account? <a href="{{ url_for('auth.register') }}">Create one</a>
  </p>
</div>
{% endblock %}
