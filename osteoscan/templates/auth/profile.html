{% extends "base.html" %}
{% block title %}Profile — {{ user.username }}{% endblock %}

{% block content %}
<div class="container--xs" style="padding-top: 8px;">
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">My Profile</h2>

      <div class="profile-row">
        <span class="profile-key">Username</span>
        <span>{{ user.username }}</span>
      </div>
      <div class="profile-row">
        <span class="profile-key">Email</span>
        <span>{{ user.email or '—' }}</span>
      </div>
      <div class="profile-row">
        <span class="profile-key">Role</span>
        <span class="badge badge-{{ user.role }}">{{ user.role }}</span>
      </div>
      <div class="profile-row">
        <span class="profile-key">Member since</span>
        <span>{{ user.created_at.strftime('%d %b %Y') }}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px;">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-full">Back to App</a>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-danger btn-full">Sign out</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
